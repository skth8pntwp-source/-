<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body, html {
        background: #000000;
        height: 100%;
        width: 100%;
    }

    .key-container {
        background: #000000;
        color: white;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
    }

    .card {
        background: #000000;
        padding: 40px;
        border-radius: 15px;
        border: 2px solid #333;
        text-align: center;
        box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    }

    h1 {
        color: #00FFFF;
        margin-top: 0;
    }

    p {
        font-size: 1.1em;
        max-width: 350px;
    }

    .key-box {
        background: #000000;
        border: 1px solid #444;
        padding: 12px;
        margin: 20px 0;
        font-size: 1.3em;
        font-weight: bold;
        color: #39FF14;
        user-select: all;
    }

    button {
        background: #000000;
        color: white;
        border: 1px solid #555;
        padding: 10px 20px;
        font-size: 1em;
        cursor: pointer;
        border-radius: 5px;
        transition: background 0.3s;
    }

    button:hover {
        background: #222;
    }
</style>

<div class="key-container">
    <div class="card">
        <h1>Diego Hub</h1>
        <p>Complete your linkvertise check to view today's key.</p>
        
        <div class="key-box">DIEGO-DAILY-ABC123XYZ</div> 
        
        <button onclick="copyKey()">Copy Key</button>
    </div>
</div>

<script>
    function copyKey() {
        var keyText = document.querySelector('.key-box').innerText;
        navigator.clipboard.writeText(keyText).then(function() {
            alert('Key copied to clipboard!');
        }).catch(function(err) {
            console.error('Could not copy text: ', err);
        });
    }
</script>
